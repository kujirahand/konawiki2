# KonaWiki2 のテストを GitHub Actions で実行する (Issue #62)
# ローカルと同じく justfile のレシピ (just lint / just test) を使うので、
# テストファイルを追加すれば CI でもそのまま実行される。
name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README の対応表記 (PHP 7.x / 8.x) と開発方針 (7.4 以降) に合わせ、
        # 最小バージョンと各 8.x 系で検証する
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # kona-engine/fw_simple サブモジュールが必要
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # テストには mbstring と SQLite (PDO) が必要
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup
        # サブモジュールの取得 (checkout で取得済みの場合は何もしない) と
        # data / cache / attach への書き込み権限の設定
        run: just setup

      - name: Lint
        run: just lint

      - name: Run tests
        # PHP CLI テスト (tests/*.test.php) と
        # HTTP 回帰テスト (tests/*_http.py、Python3 はランナー標準) を実行
        run: just test
